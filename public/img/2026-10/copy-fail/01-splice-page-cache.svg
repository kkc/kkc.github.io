<svg xmlns="http://www.w3.org/2000/svg" width="880" height="445" viewBox="0 0 880 445" role="img" aria-labelledby="title desc"><title id="title">splice() 把什麼交給加密系統？</title><desc id="desc">檔案快取的參照經由 splice、pipe 再送入 AF_ALG。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#75736d"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a83c20"/></marker></defs><rect width="880" height="445" rx="16" fill="#f8f6f1"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang TC, Microsoft JhengHei, sans-serif"><text x="40" y="39" fill="#75736d" font-size="12" font-weight="500">KAKASHI’S NOTES  /  LINUX INTERNALS</text><text x="40" y="84" fill="#25241f" font-size="30" font-weight="600">splice() 把什麼交給加密系統？</text><text x="40" y="116" fill="#75736d" font-size="17" font-weight="400">省掉資料複製，也讓不同流程接觸同一份記憶體。</text><path d="M40 140 H840" stroke="#d9d4c9"/><rect x="40" y="180" width="230" height="88" rx="10" fill="#fffdf8" stroke="#d9d4c9"/><text x="62" y="214" fill="#25241f" font-size="21" font-weight="600">檔案的 page cache</text><text x="62" y="242" fill="#75736d" font-size="16" font-weight="400">原本只有讀取權限</text><rect x="325" y="180" width="230" height="88" rx="10" fill="#fffdf8" stroke="#d9d4c9"/><text x="347" y="214" fill="#25241f" font-size="21" font-weight="600">Pipe</text><text x="347" y="242" fill="#75736d" font-size="16" font-weight="400">保留同一批頁面的參照</text><rect x="610" y="180" width="230" height="88" rx="10" fill="#fffdf8" stroke="#d9d4c9"/><text x="632" y="214" fill="#25241f" font-size="21" font-weight="600">AF_ALG</text><text x="632" y="242" fill="#75736d" font-size="16" font-weight="400">核心加密介面的輸入</text><path d="M270 224 L325 224" fill="none" stroke="#75736d" stroke-width="2" marker-end="url(#a)"/><path d="M555 224 L610 224" fill="none" stroke="#75736d" stroke-width="2" marker-end="url(#a)"/><text x="276" y="199" fill="#75736d" font-size="13" font-weight="400">splice()</text><text x="561" y="199" fill="#75736d" font-size="13" font-weight="400">splice()</text><path d="M155 280 V315 H725 V280" stroke="#d9d4c9" fill="none"/><text x="239" y="350" fill="#25241f" font-size="19" font-weight="400">傳遞的是參照，不是另外複製一份檔案內容</text><text x="239" y="380" fill="#75736d" font-size="16" font-weight="400">後面的加密流程，仍可能接觸原本的檔案快取。</text><text x="40" y="420" fill="#75736d" font-size="12" font-weight="400">COPY FAIL · CVE-2026-31431</text><text x="635" y="420" fill="#75736d" font-size="12" font-weight="400">概念示意 · 非完整呼叫流程</text></g></svg>